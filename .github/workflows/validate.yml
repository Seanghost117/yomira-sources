name: Validate Yomira Sources

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate repository structure
        run: python3 scripts/validate_repository.py
      - name: Enforce Source Definition and Source Pack version bumps
        if: github.event_name == 'pull_request'
        run: python3 scripts/validate_repository.py --base-ref "origin/${{ github.base_ref }}"
