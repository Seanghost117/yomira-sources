name: Validate Yomira Sources

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 9 * * 2,5"
  workflow_dispatch:
    inputs:
      run_live_contracts:
        description: Run bounded live Source Definition contracts
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate repository structure
        run: python3 scripts/validate_repository.py
      - name: Enforce Source Definition and Source Pack version bumps
        if: github.event_name == 'pull_request'
        run: python3 scripts/validate_repository.py --base-ref "origin/${{ github.base_ref }}"

  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Source Repository
        uses: actions/checkout@v4
        with:
          path: sources
      - name: Check out Yomira core
        uses: actions/checkout@v4
        with:
          repository: Seanghost117/ula-manga
          path: yomira
          submodules: false
      - name: Check out Source Definition tools
        uses: actions/checkout@v4
        with:
          repository: Seanghost117/yomira-source-tools
          path: yomira/tools/source-converter
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: yomira
      - name: Validate all Source Packs with the app import contract
        working-directory: yomira
        run: |
          for pack in ../sources/packs/*/source-pack.json; do
            cargo run -p yomira-source-converter -- validate-source-pack --pack "$pack"
          done
      - name: Validate curated Source Definition contracts
        working-directory: yomira
        run: >-
          cargo run -p yomira-source-converter -- contract-test
          --pack ../sources/packs/yomira-curated/source-pack.json
          --contracts ../sources/contracts/yomira-curated.json
      - name: Validate novel Source Definition contracts
        working-directory: yomira
        run: >-
          cargo run -p yomira-source-converter -- contract-test
          --pack ../sources/packs/yomira-novels/source-pack.json
          --contracts ../sources/contracts/yomira-novels.json

  live-contracts:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_live_contracts)
    runs-on: ubuntu-latest
    steps:
      - name: Check out Source Repository
        uses: actions/checkout@v4
        with:
          path: sources
      - name: Check out Yomira core
        uses: actions/checkout@v4
        with:
          repository: Seanghost117/ula-manga
          path: yomira
          submodules: false
      - name: Check out Source Definition tools
        uses: actions/checkout@v4
        with:
          repository: Seanghost117/yomira-source-tools
          path: yomira/tools/source-converter
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: yomira
      - name: Run bounded curated live contracts
        working-directory: yomira
        run: >-
          cargo run -p yomira-source-converter -- contract-test
          --pack ../sources/packs/yomira-curated/source-pack.json
          --contracts ../sources/contracts/yomira-curated.json
          --live --max-sources 12 --pretty
          --out ../sources/contract-report-curated.json
      - name: Run bounded novel live contracts
        working-directory: yomira
        run: >-
          cargo run -p yomira-source-converter -- contract-test
          --pack ../sources/packs/yomira-novels/source-pack.json
          --contracts ../sources/contracts/yomira-novels.json
          --live --max-sources 12 --pretty
          --out ../sources/contract-report-novels.json
      - name: Upload live contract reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-contract-reports
          path: sources/contract-report-*.json
          if-no-files-found: warn
